# ==============================================================================
# Smart Environment Monitor & Controller - Zephyr RTOS Configuration
# ==============================================================================

# ---- Stack Sizes ----
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# ---- Sensor Subsystem (BME280 via I2C) ----
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_BME280=y

# ---- Display (ST7735R via SPI) ----
CONFIG_SPI=y
CONFIG_DISPLAY=y

# ---- LVGL Graphics Library ----
CONFIG_LVGL=y
CONFIG_LV_MEM_CUSTOM=y
CONFIG_LV_Z_BITS_PER_PIXEL=16
CONFIG_LV_COLOR_16_SWAP=y
CONFIG_LV_Z_MEM_POOL_SIZE=16384

# LVGL Widgets
CONFIG_LV_CONF_MINIMAL=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_LABEL_TEXT_SELECTION=y
CONFIG_LV_LABEL_LONG_TXT_HINT=y
CONFIG_LV_USE_LINE=y
CONFIG_LV_USE_BAR=y
CONFIG_LV_USE_ARC=y
CONFIG_LV_USE_IMG=y

# LVGL Font (built-in Montserrat)
CONFIG_LV_FONT_MONTSERRAT_10=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_18=y

# ---- ADC (Potentiometer) ----
CONFIG_ADC=y

# ---- PWM (Fan + LED brightness) ----
CONFIG_PWM=y

# ---- GPIO (Buttons, LED) ----
CONFIG_GPIO=y

# ---- Floating Point Print Support ----
CONFIG_CBPRINTF_FP_SUPPORT=y

# ---- Logging ----
CONFIG_LOG=y
CONFIG_SENSOR_LOG_LEVEL_INF=y

# ---- Kernel Objects ----
CONFIG_POLL=y
